[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "open-marc-tasks"
version = "0.1.0"
description = "A portable JSON format and Python runner for MARC batch tasks"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pymarc>=5.1.2,<6"]

[project.optional-dependencies]
test = ["pytest", "jsonschema"]

[tool.setuptools.packages.find]
include = ["open_marc_tasks*"]

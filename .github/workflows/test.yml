name: tests

on:
  push:
  pull_request:

jobs:
  test-python-39:
    runs-on: ubuntu-latest
    container:
      image: python:3.9-slim
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -e ".[test]" "pymarc==5.1.2"
      - run: python -m pytest -q

  test-python-313:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[test]" "pymarc>=5.1.2,<6"
      - run: python -m pytest -q
